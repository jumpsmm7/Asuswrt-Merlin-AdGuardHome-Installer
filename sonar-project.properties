sonar.projectKey=jumpsmm7_Asuswrt-Merlin-AdGuardHome-Installer
sonar.organization=jumpsmm7
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,**/node_modules/**,**/.*,**/*.tar.gz,**/*.pkg.tar.bz2
sonar.test.inclusions=tests/**
sonar.shell.file.suffixes=.sh

# MD5 remains a legacy compatibility checksum only. Both release-consistency
# paths require SHA-256 independently, so MD5 is never the security trust
# boundary. Keep the weak-hash exception scoped to those two compatibility
# checks rather than disabling the rule repository-wide.
# The secure-download regression intentionally supplies an http:// URL solely
# to prove that plain HTTP is rejected and never receives insecure fallback.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=tools/check-release-consistency.sh
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/release-consistency.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/installer-secure-download-fallback.sh
