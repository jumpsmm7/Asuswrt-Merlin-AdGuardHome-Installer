name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      triaged_issues: '${{ steps.gemini_issue_analysis.outputs.summary }}'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8'
        with:
          persist-credentials: 'false'

      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }

            if (labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.');
              return;
            }

            const labelNames = labels.map((label) => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);

      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          MAX_ISSUES: "${{ vars.GEMINI_TRIAGE_MAX_ISSUES || '25' }}"
          MAX_BODY_CHARS: "${{ vars.GEMINI_TRIAGE_MAX_BODY_CHARS || '8000' }}"
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const parseBoundedInteger = (value, fallback, maximum) => {
              const parsed = Number.parseInt(value, 10);
              if (!Number.isInteger(parsed) || parsed < 1) {
                return fallback;
              }
              return Math.min(parsed, maximum);
            };

            const maxIssues = parseBoundedInteger(process.env.MAX_ISSUES, 25, 100);
            const maxBodyChars = parseBoundedInteger(process.env.MAX_BODY_CHARS, 8000, 60000);
            const issues = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })) {
              for (const issue of response.data) {
                if (issue.pull_request) {
                  continue;
                }
                const labels = (issue.labels || []).map((label) =>
                  typeof label === 'string' ? label : label.name
                );
                if (labels.length === 0 || labels.includes('status/needs-triage')) {
                  issues.push({
                    number: issue.number,
                    title: issue.title,
                    body: (issue.body || '').slice(0, maxBodyChars),
                  });
                }
              }
            }

            issues.sort((a, b) => a.number - b.number);
            const boundedIssues = issues.slice(0, maxIssues);
            core.setOutput('issues_to_triage', JSON.stringify(boundedIssues));
            core.setOutput('issue_numbers', boundedIssues.map((issue) => issue.number).join(','));
            core.info(`Found ${boundedIssues.length} issue(s) to triage (limit ${maxIssues}; body limit ${maxBodyChars} characters).`);

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          set -euo pipefail
          mkdir -p .gemini/commands
          cp .github/workflows/gemini-scheduled-triage.toml .gemini/commands/repository-gemini-scheduled-triage.toml
          jq -n \
            --arg labels "${AVAILABLE_LABELS}" \
            --argjson issues "${ISSUES_TO_TRIAGE}" \
            '{available_labels: $labels, issues_to_triage: $issues}' > .gemini/context.json
        env:
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
          ISSUES_TO_TRIAGE: '${{ steps.find_issues.outputs.issues_to_triage }}'

      - name: 'Run Gemini issue analysis resiliently'
        id: 'gemini_issue_analysis'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: './.github/actions/run-gemini-resilient'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.52.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_TRIAGE_MODEL || 'flash' }}"
          fallback_model: "${{ vars.GEMINI_TRIAGE_FALLBACK_MODEL || 'flash-lite' }}"
          fallback_delay_seconds: "${{ vars.GEMINI_FALLBACK_DELAY_SECONDS || '30' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-scheduled-triage'
          github_issue_number: '${{ steps.find_issues.outputs.issue_numbers }}'
          settings: |-
            {
              "general": {
                "retryFetchErrors": true,
                "maxAttempts": 5
              },
              "model": {
                "maxSessionTurns": 8
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/repository-gemini-scheduled-triage'

  label:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    needs:
      - 'triage'
    if: |-
      needs.triage.outputs.available_labels != '' &&
      needs.triage.outputs.triaged_issues != '' &&
      needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply validated labels'
        env:
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          TRIAGED_ISSUES: '${{ needs.triage.outputs.triaged_issues }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const availableLabels = new Set(
              (process.env.AVAILABLE_LABELS || '')
                .split(',')
                .map((label) => label.trim())
                .filter(Boolean),
            );

            let raw = (process.env.TRIAGED_ISSUES || '').trim();
            raw = raw
              .replace(/^```(?:json)?\s*/i, '')
              .replace(/\s*```$/i, '')
              .trim();

            const firstBracket = raw.indexOf('[');
            const lastBracket = raw.lastIndexOf(']');
            if (firstBracket < 0 || lastBracket < firstBracket) {
              core.warning('Gemini output did not contain a JSON array; no labels were changed.');
              return;
            }

            let triagedIssues;
            try {
              triagedIssues = JSON.parse(raw.slice(firstBracket, lastBracket + 1));
            } catch (error) {
              core.warning(`Unable to parse Gemini triage output: ${error.message}`);
              return;
            }

            if (!Array.isArray(triagedIssues)) {
              core.warning('Gemini triage output was not an array; no labels were changed.');
              return;
            }

            triagedIssues.sort((a, b) => Number(a?.issue_number || 0) - Number(b?.issue_number || 0));

            for (const issue of triagedIssues) {
              const issueNumber = Number(issue?.issue_number);
              if (!Number.isInteger(issueNumber) || issueNumber < 1) {
                core.warning(`Skipping entry with invalid issue number: ${JSON.stringify(issue)}`);
                continue;
              }

              const requestedLabels = Array.isArray(issue?.labels_to_set)
                ? issue.labels_to_set
                : [];
              const labelsToSet = [...new Set(
                requestedLabels
                  .filter((label) => typeof label === 'string')
                  .map((label) => label.trim())
                  .filter((label) => label && availableLabels.has(label)),
              )].sort();

              if (labelsToSet.length === 0) {
                core.info(`Skipping issue #${issueNumber} because Gemini returned no valid labels.`);
                continue;
              }

              try {
                await github.rest.issues.setLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labelsToSet,
                });
                core.info(`Set issue #${issueNumber} labels to: ${labelsToSet.join(', ')}`);
              } catch (error) {
                core.warning(`Unable to label issue #${issueNumber}: ${error.message}`);
              }
            }
