name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *'
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
      - '.github/workflows/gemini-scheduled-triage.toml'
      - '.github/actions/run-gemini-resilient/action.yml'
  push:
    branches:
      - 'main'
      - 'release/**/*'
    paths:
      - '.github/workflows/gemini-scheduled-triage.yml'
      - '.github/workflows/gemini-scheduled-triage.toml'
      - '.github/actions/run-gemini-resilient/action.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 25
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels_json: '${{ steps.get_labels.outputs.available_labels_json }}'
      issues_json: '${{ steps.find_issues.outputs.issues_json }}'
      triaged_issues_json: '${{ steps.validate_output.outputs.triaged_issues_json }}'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8'
        with:
          persist-credentials: 'false'

      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }

            const labelNames = [...new Set(labels.map((label) => label.name))].sort();
            if (labelNames.length === 0) {
              core.setFailed('There are no issue labels in this repository.');
              return;
            }

            core.setOutput('available_labels_json', JSON.stringify(labelNames));
            core.info(`Found ${labelNames.length} repository labels.`);

      - name: 'Install issue-discovery dependencies'
        run: |-
          set -euo pipefail
          packages=()
          command -v jq >/dev/null 2>&1 || packages+=('jq')
          command -v gh >/dev/null 2>&1 || packages+=('gh')
          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          jq --version
          gh --version

      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          MAX_ISSUES: "${{ vars.GEMINI_TRIAGE_MAX_ISSUES || '25' }}"
          MAX_BODY_CHARS: "${{ vars.GEMINI_TRIAGE_MAX_BODY_CHARS || '8000' }}"
        run: |-
          set -euo pipefail

          case "${MAX_ISSUES}" in
            ''|*[!0-9]*) MAX_ISSUES=25 ;;
          esac
          case "${MAX_BODY_CHARS}" in
            ''|*[!0-9]*) MAX_BODY_CHARS=8000 ;;
          esac
          if (( MAX_ISSUES < 1 )); then MAX_ISSUES=1; fi
          if (( MAX_ISSUES > 100 )); then MAX_ISSUES=100; fi
          if (( MAX_BODY_CHARS < 500 )); then MAX_BODY_CHARS=500; fi
          if (( MAX_BODY_CHARS > 20000 )); then MAX_BODY_CHARS=20000; fi

          issues="$(gh issue list \
            --state open \
            --search 'no:label OR label:"status/needs-triage"' \
            --json number,title,body \
            --limit "${MAX_ISSUES}" \
            --repo "${GITHUB_REPOSITORY}" \
            | jq -c --argjson max_body "${MAX_BODY_CHARS}" \
                'map({number, title: (.title // ""), body: ((.body // "")[0:$max_body])})'
          )"

          if ! jq -e 'type == "array"' <<< "${issues}" >/dev/null; then
            echo '::error title=Invalid issue discovery output::Expected a JSON array from gh issue list.'
            exit 1
          fi

          issue_numbers="$(jq -r 'map(.number | tostring) | join(",")' <<< "${issues}")"
          issue_count="$(jq 'length' <<< "${issues}")"
          printf 'issues_json=%s\n' "${issues}" >> "${GITHUB_OUTPUT}"
          printf 'issue_numbers=%s\n' "${issue_numbers}" >> "${GITHUB_OUTPUT}"
          echo "Found ${issue_count} issue(s) to triage."

      - name: 'Prepare prompt context'
        if: '${{ steps.find_issues.outputs.issues_json != "[]" }}'
        env:
          AVAILABLE_LABELS_JSON: '${{ steps.get_labels.outputs.available_labels_json }}'
          ISSUES_JSON: '${{ steps.find_issues.outputs.issues_json }}'
        run: |-
          set -euo pipefail
          mkdir -p .gemini/commands
          cp .github/workflows/gemini-scheduled-triage.toml .gemini/commands/repository-gemini-scheduled-triage.toml
          jq -n \
            --argjson labels "${AVAILABLE_LABELS_JSON}" \
            --argjson issues "${ISSUES_JSON}" \
            '{available_labels: $labels, issues_to_triage: $issues}' > .gemini/context.json

      - name: 'Run Gemini scheduled triage resiliently'
        id: 'gemini_issue_analysis'
        if: '${{ steps.find_issues.outputs.issues_json != "[]" }}'
        uses: './.github/actions/run-gemini-resilient'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.52.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_TRIAGE_MODEL || vars.GEMINI_MODEL || 'flash' }}"
          fallback_model: "${{ vars.GEMINI_TRIAGE_FALLBACK_MODEL || vars.GEMINI_FALLBACK_MODEL || 'flash-lite' }}"
          fallback_delay_seconds: "${{ vars.GEMINI_FALLBACK_DELAY_SECONDS || '45' }}"
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'gemini-scheduled-triage'
          github_issue_number: '${{ steps.find_issues.outputs.issue_numbers }}'
          settings: |-
            {
              "general": {
                "retryFetchErrors": true,
                "maxAttempts": 6
              },
              "model": {
                "maxSessionTurns": 12
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/repository-gemini-scheduled-triage'

      - name: 'Validate Gemini triage output'
        id: 'validate_output'
        if: '${{ always() }}'
        env:
          RAW_SUMMARY: '${{ steps.gemini_issue_analysis.outputs.summary }}'
          AVAILABLE_LABELS_JSON: '${{ steps.get_labels.outputs.available_labels_json }}'
          ISSUES_JSON: '${{ steps.find_issues.outputs.issues_json }}'
        run: |-
          set -euo pipefail

          validated='[]'
          if [[ -n "${RAW_SUMMARY}" ]] && jq -e 'type == "array"' <<< "${RAW_SUMMARY}" >/dev/null 2>&1; then
            validated="$(jq -cn \
              --argjson raw "${RAW_SUMMARY}" \
              --argjson allowed "${AVAILABLE_LABELS_JSON:-[]}" \
              --argjson issues "${ISSUES_JSON:-[]}" \
              '[
                $raw[]?
                | select(type == "object")
                | .issue_number as $number
                | select(($number | type) == "number" and ($issues | map(.number) | index($number) != null))
                | (.labels_to_set // []) as $labels
                | {
                    issue_number: $number,
                    labels_to_set: (
                      $labels
                      | select(type == "array")
                      | map(. as $label | select(($label | type) == "string" and ($allowed | index($label) != null)))
                      | unique
                    ),
                    explanation: ((.explanation // "") | tostring | .[0:500])
                  }
                | select(.labels_to_set | length > 0)
              ] | unique_by(.issue_number)'
            )"
          elif [[ -n "${RAW_SUMMARY}" ]]; then
            echo '::warning title=Invalid Gemini scheduled-triage output::Expected a JSON array; no labels will be applied.'
          fi

          printf 'triaged_issues_json=%s\n' "${validated}" >> "${GITHUB_OUTPUT}"

  label:
    runs-on: 'ubuntu-latest'
    needs: 'triage'
    if: '${{ needs.triage.outputs.triaged_issues_json != "" && needs.triage.outputs.triaged_issues_json != "[]" }}'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID != "" }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply validated labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        env:
          AVAILABLE_LABELS_JSON: '${{ needs.triage.outputs.available_labels_json }}'
          TRIAGED_ISSUES_JSON: '${{ needs.triage.outputs.triaged_issues_json }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const availableLabels = JSON.parse(process.env.AVAILABLE_LABELS_JSON || '[]');
            const triagedIssues = JSON.parse(process.env.TRIAGED_ISSUES_JSON || '[]');

            for (const issue of triagedIssues) {
              const issueNumber = Number.parseInt(issue.issue_number, 10);
              const labels = [...new Set((issue.labels_to_set || [])
                .filter((label) => typeof label === 'string' && availableLabels.includes(label)))].sort();

              if (!Number.isInteger(issueNumber) || issueNumber < 1 || labels.length === 0) {
                core.warning(`Skipping invalid triage entry: ${JSON.stringify(issue)}`);
                continue;
              }

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels,
                });
                core.info(`Applied labels to issue #${issueNumber}: ${labels.join(', ')}`);

                if (availableLabels.includes('status/needs-triage') && !labels.includes('status/needs-triage')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name: 'status/needs-triage',
                    });
                  } catch (error) {
                    if (error.status !== 404) {
                      core.warning(`Could not remove status/needs-triage from #${issueNumber}: ${error.message}`);
                    }
                  }
                }
              } catch (error) {
                core.warning(`Could not label issue #${issueNumber}: ${error.message}`);
              }
            }
