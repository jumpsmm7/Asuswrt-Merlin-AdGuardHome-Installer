name: '🔀 Gemini Dispatch'

on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: 'read'
    steps:
      - name: 'Print bounded event context'
        env:
          DEBUG_EVENT_NAME: '${{ github.event_name }}'
          DEBUG_ACTION: '${{ github.event.action }}'
          DEBUG_ACTOR: '${{ github.actor }}'
          DEBUG_REPOSITORY: '${{ github.repository }}'
          DEBUG_ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
        run: |-
          set -euo pipefail
          env | grep '^DEBUG_' | sort

  dispatch:
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association || '')
      )
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID != "" }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body || github.event.issue.body || "" }}'
        with:
          script: |-
            const eventType = process.env.EVENT_TYPE || '';
            const request = process.env.REQUEST || '';

            let command = 'fallthrough';
            let additionalContext = '';

            if (eventType === 'pull_request.opened') {
              command = 'review';
            } else if (eventType === 'issues.opened' || eventType === 'issues.reopened') {
              command = 'triage';
            } else if (request.startsWith('@gemini-cli /review')) {
              command = 'review';
              additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
            } else if (request.startsWith('@gemini-cli /triage')) {
              command = 'triage';
            } else if (request.startsWith('@gemini-cli /approve')) {
              command = 'approve';
              additionalContext = request.replace(/^@gemini-cli \/approve/, '').trim();
            } else if (request.startsWith('@gemini-cli')) {
              command = 'invoke';
              additionalContext = request.replace(/^@gemini-cli/, '').trim();
            }

            core.setOutput('command', command);
            core.setOutput('additional_context', additionalContext);
            core.info(`Selected Gemini command: ${command}`);

      - name: 'Acknowledge request'
        if: '${{ steps.extract_command.outputs.command != "fallthrough" }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        env:
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.warning('No valid issue or pull request number was available for acknowledgement.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🤖 Hi @${context.actor}, I received your request. Progress is available in [the workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });

  review:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == "review" }}'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == "triage" }}'
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == "invoke" }}'
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  plan-execute:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == "approve" }}'
    uses: './.github/workflows/gemini-plan-execute.yml'
    permissions:
      contents: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs: ['dispatch', 'review', 'triage', 'invoke', 'plan-execute']
    if: '${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == "fallthrough") }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID != "" }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Report failure'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        env:
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          COMMAND: '${{ needs.dispatch.outputs.command }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.warning('No valid issue or pull request number was available for failure reporting.');
              return;
            }

            const command = process.env.COMMAND || 'unknown';
            const unsupported = command === 'fallthrough';
            const body = unsupported
              ? `🤖 @${context.actor}, I could not identify a supported Gemini command. Use \`@gemini-cli /review\`, \`@gemini-cli /triage\`, \`@gemini-cli /approve\`, or \`@gemini-cli <request>\`.`
              : `🤖 @${context.actor}, the Gemini \`${command}\` workflow failed. See [the workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the exact error.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
