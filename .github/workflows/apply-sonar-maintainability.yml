name: Apply Sonar Maintainability Fixes

on:
  push:
    branches: [v2.6.5]

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: apply sonar maintainability fixes'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: v2.6.5
          fetch-depth: 0

      - name: Apply reviewed Sonar fixes
        run: python3 .github/scripts/apply-sonar-maintainability.py

      - name: Validate focused changes
        run: |
          set -eu
          sh -n tools/download-adguardhome-static.sh
          sh -n tools/code-quality.sh
          sh -n tools/check-release-consistency.sh
          sh -n .agents/skills/qodo-get-rules/config-parsing.sh
          sh tests/code-quality-checks.sh
          sh tests/release-consistency.sh
          sh tests/download-static-failure-safety.sh
          sh tests/qodo-get-rules-config-validation.sh

      - name: Commit fixes and remove helper files
        run: |
          set -eu
          rm -f .github/workflows/apply-sonar-maintainability.yml
          rm -f .github/scripts/apply-sonar-maintainability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sonar-project.properties \
            tools/download-adguardhome-static.sh \
            tools/code-quality.sh \
            tools/check-release-consistency.sh \
            .agents/skills/qodo-get-rules/config-parsing.sh \
            .github/workflows/apply-sonar-maintainability.yml \
            .github/scripts/apply-sonar-maintainability.py
          git diff --cached --check
          git commit -m 'fix: address Sonar maintainability findings'
          git push origin HEAD:v2.6.5
