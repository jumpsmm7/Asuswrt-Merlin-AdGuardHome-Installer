name: OSV Dependency Scan

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, master, main]
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: OSV new-vulnerability scan
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@3adb4b14a2b0623876d18d863a498b785fb3752d # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true

  scan-full:
    name: OSV full vulnerability scan
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@3adb4b14a2b0623876d18d863a498b785fb3752d # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true
