name: OSV Dependency Scan

on:
  pull_request:
  merge_group:
  push:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr:
    name: OSV new-vulnerability scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out target branch
        id: differential-base
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base_revision="${BASE_REVISION}"
          case "${base_revision}" in
            0000000000000000000000000000000000000000) base_revision="${GITHUB_SHA}^" ;;
          esac
          if ! git rev-parse --verify "${base_revision}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${base_revision}" || true
          fi
          if git rev-parse --verify "${base_revision}^{commit}" >/dev/null 2>&1; then
            git checkout --detach "${base_revision}"
            printf '%s\n' 'available=true' >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' '{}' >old-results.json
            printf '%s\n' 'available=false' >> "${GITHUB_OUTPUT}"
            printf '%s\n' "Differential OSV scan skipped: predecessor ${base_revision} is unavailable."
          fi

      - name: Scan existing code
        if: steps.differential-base.outputs.available == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            -r
            ./

      - name: Check out pull request merge
        run: git checkout -f "${GITHUB_SHA}"

      - name: Scan new code
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            -r
            ./

      - name: Report newly introduced vulnerabilities
        if: steps.differential-base.outputs.available == 'true'
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() && steps.differential-base.outputs.available == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: OSV Scanner PR SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() && steps.differential-base.outputs.available == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: osv-scanner-pr

  scan-full:
    name: OSV full vulnerability scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Scan repository
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            -r
            ./

      - name: Report vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: OSV Scanner SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: osv-scanner
