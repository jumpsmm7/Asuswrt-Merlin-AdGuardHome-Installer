name: OSV Dependency Scan

on:
  pull_request:
  merge_group:
  push:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-pr:
    name: OSV new-vulnerability scan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Prepare pinned scanner and preserve current validation tools
        id: scan-tools
        run: sh .github/scripts/run-osv-scan.sh prepare

      - name: Select exact comparison snapshot
        id: differential-base
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: sh .github/scripts/osv-differential-base.sh

      - name: Check out target branch
        if: steps.differential-base.outputs.baseline_available == 'true'
        env:
          BASE_REVISION: ${{ steps.differential-base.outputs.base_sha }}
        run: git checkout --detach "${BASE_REVISION}"

      - name: Scan existing code
        id: scan-existing
        if: steps.differential-base.outputs.baseline_available == 'true'
        env:
          SCAN_TOOLS: ${{ steps.scan-tools.outputs.tool_directory }}
        run: sh "${SCAN_TOOLS}/run-osv-scan.sh" old-results.json

      - name: Check out pull request merge
        run: git checkout -f "${GITHUB_SHA}"

      - name: Scan new code
        id: scan-new
        env:
          SCAN_TOOLS: ${{ steps.scan-tools.outputs.tool_directory }}
        run: sh "${SCAN_TOOLS}/run-osv-scan.sh" new-results.json

      - name: Report newly introduced vulnerabilities
        if: steps.differential-base.outputs.baseline_available == 'true' && steps.scan-existing.outputs.ready == 'true' && steps.scan-new.outputs.ready == 'true'
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output-files=sarif:results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Report vulnerabilities without a comparison snapshot
        if: steps.differential-base.outputs.baseline_available == 'false' && steps.scan-new.outputs.ready == 'true'
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output-files=sarif:results.sarif
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() && steps.scan-new.outputs.ready == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: OSV Scanner PR SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() && steps.scan-new.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: osv-scanner-pr

  scan-full:
    name: OSV full vulnerability scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare pinned scanner and preserve current validation tools
        id: scan-tools
        run: sh .github/scripts/run-osv-scan.sh prepare

      - name: Scan repository
        id: scan-full
        env:
          SCAN_TOOLS: ${{ steps.scan-tools.outputs.tool_directory }}
        run: sh "${SCAN_TOOLS}/run-osv-scan.sh" results.json

      - name: Report vulnerabilities
        if: steps.scan-full.outputs.ready == 'true'
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output-files=sarif:results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() && steps.scan-full.outputs.ready == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: OSV Scanner SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() && steps.scan-full.outputs.ready == 'true' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: osv-scanner
