name: '🧙 Gemini Plan Execution'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-plan-execute-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  plan-execute:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 35
    permissions:
      contents: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID != "" }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8'
        with:
          persist-credentials: 'false'

      - name: 'Install prompt dependencies'
        run: |-
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
          fi
          jq --version

      - name: 'Prepare prompt context'
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        run: |-
          set -euo pipefail
          mkdir -p .gemini/commands
          cp .github/workflows/gemini-plan-execute.toml .gemini/commands/repository-gemini-plan-execute.toml
          jq -n \
            --arg title "${TITLE}" \
            --arg desc "${DESCRIPTION}" \
            --arg event "${EVENT_NAME}" \
            --arg pr "${IS_PULL_REQUEST}" \
            --arg num "${ISSUE_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > .gemini/context.json

      - name: 'Run Gemini CLI resiliently'
        id: 'run_gemini'
        uses: './.github/actions/run-gemini-resilient'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          github_token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.52.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'auto' }}"
          fallback_model: "${{ vars.GEMINI_FALLBACK_MODEL || 'flash' }}"
          fallback_delay_seconds: "${{ vars.GEMINI_FALLBACK_DELAY_SECONDS || '45' }}"
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'gemini-plan-execute'
          github_pr_number: '${{ github.event.pull_request.number }}'
          github_issue_number: '${{ github.event.issue.number }}'
          requires_docker: 'true'
          settings: |-
            {
              "general": {
                "retryFetchErrors": true,
                "maxAttempts": 6
              },
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcp": {
                "allowed": ["github"]
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v1.0.5"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "create_pull_request",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "create_branch",
                    "create_or_update_file",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "timeout": 60000,
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                    "GITHUB_TOOLS": "add_issue_comment,issue_read,list_issues,search_issues,create_pull_request,pull_request_read,list_pull_requests,search_pull_requests,create_branch,create_or_update_file,get_commit,get_file_contents,list_commits,search_code"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/repository-gemini-plan-execute'
