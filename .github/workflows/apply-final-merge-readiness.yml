name: Apply final merge-readiness fixes

on:
  push:
    branches:
      - v2.6.5

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage final merge-readiness patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: v2.6.5
          fetch-depth: 0

      - name: Apply targeted fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_range(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              p.write_text(text[:start_index] + replacement.rstrip('\n') + '\n\n' + text[end_index:].lstrip('\n'))

          installer_http_get_file = r'''http_get_file() {
          	local URL OUT HEADERS ALLOW_INSECURE CURL_ARGS WGET_ARGS FALLBACK_ARG SECURE_STATUS
          	URL="$1"
          	OUT="$2"
          	HEADERS="${3:-}"
          	ALLOW_INSECURE="${4:-}"
          	if ai_have_cmd curl; then
          		CURL_ARGS="$(curl_common_args)"
          		if [ -n "${HEADERS}" ]; then
          			curl ${CURL_ARGS} -D "${HEADERS}" -f -sL "${URL}" -o "${OUT}"
          			SECURE_STATUS="$?"
          		else
          			curl ${CURL_ARGS} -f -sL "${URL}" -o "${OUT}"
          			SECURE_STATUS="$?"
          		fi
          		[ "${SECURE_STATUS}" -eq 0 ] && return 0
          		[ "${ALLOW_INSECURE}" = "insecure" ] || return "${SECURE_STATUS}"
          		case "${URL}" in
          			https://*) ;;
          			*) return "${SECURE_STATUS}" ;;
          		esac
          		FALLBACK_ARG="$(curl_insecure_arg)"
          		[ -n "${FALLBACK_ARG}" ] || return "${SECURE_STATUS}"
          		ptxt_warn "Certificate-verified download failed for ${URL}; retrying with certificate verification disabled."
          		rm -f "${OUT}" || return "${SECURE_STATUS}"
          		if [ -n "${HEADERS}" ]; then
          			: >"${HEADERS}" || return "${SECURE_STATUS}"
          		fi
          		CURL_ARGS="${CURL_ARGS}${FALLBACK_ARG}"
          		if [ -n "${HEADERS}" ]; then
          			curl ${CURL_ARGS} -D "${HEADERS}" -f -sL "${URL}" -o "${OUT}"
          		else
          			curl ${CURL_ARGS} -f -sL "${URL}" -o "${OUT}"
          		fi
          	elif ai_have_cmd wget; then
          		WGET_ARGS="$(wget_common_args)"
          		if [ -n "${HEADERS}" ] && wget_has_option '--server-response'; then
          			wget ${WGET_ARGS} --server-response -q -O "${OUT}" "${URL}" 2>"${HEADERS}"
          			SECURE_STATUS="$?"
          		else
          			[ -n "${HEADERS}" ] && : >"${HEADERS}"
          			wget ${WGET_ARGS} -q -O "${OUT}" "${URL}"
          			SECURE_STATUS="$?"
          		fi
          		[ "${SECURE_STATUS}" -eq 0 ] && return 0
          		[ "${ALLOW_INSECURE}" = "insecure" ] || return "${SECURE_STATUS}"
          		case "${URL}" in
          			https://*) ;;
          			*) return "${SECURE_STATUS}" ;;
          		esac
          		FALLBACK_ARG="$(wget_insecure_arg)"
          		[ -n "${FALLBACK_ARG}" ] || return "${SECURE_STATUS}"
          		ptxt_warn "Certificate-verified download failed for ${URL}; retrying with certificate verification disabled."
          		rm -f "${OUT}" || return "${SECURE_STATUS}"
          		if [ -n "${HEADERS}" ]; then
          			: >"${HEADERS}" || return "${SECURE_STATUS}"
          		fi
          		WGET_ARGS="${WGET_ARGS}${FALLBACK_ARG}"
          		if [ -n "${HEADERS}" ] && wget_has_option '--server-response'; then
          			wget ${WGET_ARGS} --server-response -q -O "${OUT}" "${URL}" 2>"${HEADERS}"
          		else
          			[ -n "${HEADERS}" ] && : >"${HEADERS}"
          			wget ${WGET_ARGS} -q -O "${OUT}" "${URL}"
          		fi
          	else
          		return 127
          	fi
          }'''

          installer_http_get_stdout = r'''http_get_stdout() {
          	local URL CURL_ARGS WGET_ARGS
          	URL="$1"
          	if ai_have_cmd curl; then
          		CURL_ARGS="$(curl_common_args)"
          		curl ${CURL_ARGS} -f -sL "${URL}"
          	elif ai_have_cmd wget; then
          		WGET_ARGS="$(wget_common_args)"
          		wget ${WGET_ARGS} -q -O - "${URL}"
          	else
          		return 127
          	fi
          }'''

          replace_range('installer', 'http_get_file() {\n', 'http_get_stdout() {\n', installer_http_get_file)
          replace_range('installer', 'http_get_stdout() {\n', 'http_probe() {\n', installer_http_get_stdout)

          s99_launch = r'''launch_dns_port_guard() {
          	dns_handoff_set_current_identity || return 1
          	DNS_GUARD_OWNER_PID="${DNS_HANDOFF_CURRENT_PID}"
          	DNS_GUARD_OWNER_START_TIME="${DNS_HANDOFF_CURRENT_START_TIME}"
          	export DNS_GUARD_OWNER_PID DNS_GUARD_OWNER_START_TIME
          	DNS_GUARD_READY_DIR="${DNS_HANDOFF_DIR}/guard-${DNS_GUARD_OWNER_PID}-${DNS_GUARD_OWNER_START_TIME}"
          	DNS_GUARD_READY_FILE="${DNS_GUARD_READY_DIR}/ready"
          	export DNS_GUARD_READY_DIR DNS_GUARD_READY_FILE
          	[ ! -e "${DNS_GUARD_READY_DIR}" ] || return 1
          	(
          		umask 077
          		mkdir "${DNS_GUARD_READY_DIR}"
          	) || return 1
          	dns_handoff_path_has_owner_mode d 'rwx------' "${DNS_GUARD_READY_DIR}" || {
          		remove_current_dns_guard_readiness || true
          		return 1
          	}
          	start_dns_port_guard >/dev/null 2>&1 &
          	ADGUARDHOME_DNS_GUARD_PID="$!"
          	_dns_guard_ready_attempts=0
          	_dns_guard_ready_limit="$(dns_retry_limit "${ADGUARDHOME_DNS_GUARD_READY_RETRIES:-}" 50)"
          	_dns_guard_ready_uses_usleep=0
          	if which usleep >/dev/null 2>&1; then
          		_dns_guard_ready_uses_usleep=1
          	else
          		_dns_guard_ready_limit="$(((_dns_guard_ready_limit + 9) / 10))"
          	fi
          	while [ "${_dns_guard_ready_attempts}" -lt "${_dns_guard_ready_limit}" ]; do
          		kill -0 "${ADGUARDHOME_DNS_GUARD_PID}" 2>/dev/null || break
          		if dns_guard_readiness_matches_identity &&
          			dns_handoff_marker_matches_identity "${DNS_GUARD_OWNER_PID}" "${DNS_GUARD_OWNER_START_TIME}"; then
          			kill -0 "${ADGUARDHOME_DNS_GUARD_PID}" 2>/dev/null && return 0
          			break
          		fi
          		_dns_guard_ready_attempts="$((_dns_guard_ready_attempts + 1))"
          		if [ "${_dns_guard_ready_attempts}" -lt "${_dns_guard_ready_limit}" ]; then
          			if [ "${_dns_guard_ready_uses_usleep}" -eq 1 ]; then
          				command usleep 100000
          			else
          				sleep 1
          			fi
          		fi
          	done
          	stop_dns_port_guard
          	remove_current_dns_guard_readiness || true
          	return 1
          }'''
          replace_range('S99AdGuardHome', 'launch_dns_port_guard() {\n', '# Service hook helpers\n', s99_launch)

          adguard_helpers = r'''# monotonic_seconds returns integer seconds from the kernel monotonic uptime clock.
          monotonic_seconds() {
          	local UPTIME_REST UPTIME_SECONDS UPTIME_VALUE
          	[ -r /proc/uptime ] || return 1
          	IFS=' ' read -r UPTIME_VALUE UPTIME_REST </proc/uptime || return 1
          	UPTIME_SECONDS="${UPTIME_VALUE%%.*}"
          	case "${UPTIME_SECONDS}" in
          		"" | *[!0-9]*) return 1 ;;
          	esac
          	printf '%s\n' "${UPTIME_SECONDS}"
          }

          # post_stop_dnsmasq_timeout returns the bounded local-DNS recovery budget in seconds.
          post_stop_dnsmasq_timeout() {
          	local CONFIGURED RESTART_SECONDS TIMEOUT
          	CONFIGURED="${ADGUARDHOME_DNSMASQ_READY_TIMEOUT:-}"
          	case "${CONFIGURED}" in
          		"" | *[!0-9]*) ;;
          		*)
          			if [ "${CONFIGURED}" -ge 5 ] && [ "${CONFIGURED}" -le 120 ]; then
          				printf '%s\n' "${CONFIGURED}"
          				return 0
          			fi
          			;;
          	esac
          	RESTART_SECONDS="${1:-0}"
          	case "${RESTART_SECONDS}" in
          		"" | *[!0-9]*) RESTART_SECONDS="0" ;;
          	esac
          	TIMEOUT="$((RESTART_SECONDS * 3 + 10))"
          	[ "${TIMEOUT}" -ge 15 ] || TIMEOUT="15"
          	[ "${TIMEOUT}" -le 60 ] || TIMEOUT="60"
          	printf '%s\n' "${TIMEOUT}"
          }

          '''
          adguard_marker = '# post_stop_dnsmasq_ready verifies that dnsmasq owns local port 53 and resolves localhost through an available DNS server.\n'
          adguard_text = Path('AdGuardHome.sh').read_text()
          if adguard_text.count(adguard_marker) != 1:
              raise SystemExit('AdGuardHome.sh: post_stop_dnsmasq_ready marker not unique')
          Path('AdGuardHome.sh').write_text(adguard_text.replace(adguard_marker, adguard_helpers + adguard_marker, 1))

          adguard_stop = r'''stop_adguardhome() {
          	local DNSMASQ_READY_ATTEMPTS DNSMASQ_READY_TIMEOUT DNSMASQ_RESTART_ELAPSED DNSMASQ_RESTART_END DNSMASQ_RESTART_START DNSMASQ_WAS_MANAGED STOP_STATUS db
          	STOP_STATUS="0"
          	DNSMASQ_WAS_MANAGED="0"
          	DNSMASQ_RESTART_ELAPSED="0"
          	if adguard_dnsmasq_managed; then
          		DNSMASQ_WAS_MANAGED="1"
          	fi
          	case "$(pidof "${PROCS}" 2>/dev/null | wc -w)" in
          		0)
          			:
          			;;
          		*)
          			if ! lower_script stop && ! lower_script kill; then
          				STOP_STATUS="1"
          			fi
          			;;
          	esac
          	if ! post_stop_process_ready; then
          		agh_log error stop_adguardhome "state=stopping action=stop_process reason=process_still_active result=active process=${PROCS}"
          		STOP_STATUS="1"
          	fi
          	if [ "${ADGUARDHOME_SKIP_DNSMASQ_RESTART:-}" != "1" ] && [ "${DNSMASQ_WAS_MANAGED}" -eq 1 ]; then
          		DNSMASQ_RESTART_START="$(monotonic_seconds 2>/dev/null)" || DNSMASQ_RESTART_START=""
          		if ! service restart_dnsmasq >/dev/null 2>&1; then
          			agh_log error stop_adguardhome "state=stopping action=restart_dnsmasq reason=service_restart_failed result=failed process=${PROCS}"
          			STOP_STATUS="1"
          		fi
          		DNSMASQ_RESTART_END="$(monotonic_seconds 2>/dev/null)" || DNSMASQ_RESTART_END=""
          		case "${DNSMASQ_RESTART_START}:${DNSMASQ_RESTART_END}" in
          			*[!0-9:]* | :* | *:)
          				DNSMASQ_RESTART_ELAPSED="0"
          				;;
          			*)
          				if [ "${DNSMASQ_RESTART_END}" -ge "${DNSMASQ_RESTART_START}" ]; then
          					DNSMASQ_RESTART_ELAPSED="$((DNSMASQ_RESTART_END - DNSMASQ_RESTART_START))"
          				fi
          				;;
          		esac
          	fi
          	if [ "${DNSMASQ_WAS_MANAGED}" -eq 1 ]; then
          		DNSMASQ_READY_TIMEOUT="$(post_stop_dnsmasq_timeout "${DNSMASQ_RESTART_ELAPSED}")"
          		DNSMASQ_READY_ATTEMPTS="0"
          		until post_stop_dnsmasq_ready; do
          			DNSMASQ_READY_ATTEMPTS="$((DNSMASQ_READY_ATTEMPTS + 1))"
          			if [ "${DNSMASQ_READY_ATTEMPTS}" -ge "${DNSMASQ_READY_TIMEOUT}" ]; then
          				agh_log error stop_adguardhome "state=stopping action=verify_local_dns reason=dnsmasq_not_ready result=failed attempts=${DNSMASQ_READY_ATTEMPTS} restart_elapsed=${DNSMASQ_RESTART_ELAPSED} timeout=${DNSMASQ_READY_TIMEOUT}"
          				STOP_STATUS="1"
          				break
          			fi
          			sleep 1
          		done
          		if [ "${DNSMASQ_READY_ATTEMPTS}" -lt "${DNSMASQ_READY_TIMEOUT}" ]; then
          			agh_log info stop_adguardhome "state=stopping action=verify_local_dns result=ready attempts=${DNSMASQ_READY_ATTEMPTS} restart_elapsed=${DNSMASQ_RESTART_ELAPSED} timeout=${DNSMASQ_READY_TIMEOUT}"
          		fi
          	fi
          	if ! post_stop_handoff_cleared; then
          		agh_log error stop_adguardhome "state=stopping action=verify_handoff reason=installer_marker_remains result=failed"
          		STOP_STATUS="1"
          	fi
          	for db in stats.db sessions.db; do
          		remove_database_link "/tmp/${db}" "${WORK_DIR}/data/${db}"
          	done
          	return "${STOP_STATUS}"
          }'''
          replace_range('AdGuardHome.sh', 'stop_adguardhome() {\n', 'stop_monitor() {\n', adguard_stop)

          # Keep the broad DNS handoff regression on the fast usleep path.
          replace_once(
              'tests/dns-startup-handoff.sh',
              'awk | chmod | kill | ln | logger | ls | mkdir | netstat | nvram | pidof | rm | service | sleep)',
              'awk | chmod | kill | ln | logger | ls | mkdir | netstat | nvram | pidof | rm | service | sleep | usleep)'
          )

          # Existing stop-failure cases intentionally exercise a five-second override;
          # dedicated adaptive tests below cover the new default behavior.
          replace_once(
              'tests/stop-adguardhome-failure.sh',
              "sed -n '/^post_stop_process_ready() {$/,/^}$/p; /^post_stop_handoff_cleared() {$/,/^}$/p; /^post_stop_dnsmasq_ready() {$/,/^}$/p; /^stop_adguardhome() {$/,/^}$/p' \"${SCRIPT_PATH}\" >\"${FUNCTION_FILE}\" ||",
              "sed -n '/^monotonic_seconds() {$/,/^}$/p; /^post_stop_dnsmasq_timeout() {$/,/^}$/p; /^post_stop_process_ready() {$/,/^}$/p; /^post_stop_handoff_cleared() {$/,/^}$/p; /^post_stop_dnsmasq_ready() {$/,/^}$/p; /^stop_adguardhome() {$/,/^}$/p' \"${SCRIPT_PATH}\" >\"${FUNCTION_FILE}\" ||"
          )
          replace_once(
              'tests/stop-adguardhome-failure.sh',
              '\tunset ADGUARDHOME_SKIP_DNSMASQ_RESTART\n',
              '\tunset ADGUARDHOME_SKIP_DNSMASQ_RESTART\n\tADGUARDHOME_DNSMASQ_READY_TIMEOUT="5"\n'
          )

          secure_test = r'''#!/bin/sh
          # Verify installer downloads use certificate verification before any insecure fallback.
          set -u

          INSTALLER="${1:-installer}"
          TMP_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/installer-secure-download.XXXXXX")" || exit 1
          FUNCTIONS_FILE="${TMP_ROOT}/functions"
          CALLS_FILE="${TMP_ROOT}/calls"
          WARN_FILE="${TMP_ROOT}/warnings"

          cleanup() { rm -rf "${TMP_ROOT}"; }
          fail() { printf '%s\n' "FAIL: $*" >&2; exit 1; }
          trap cleanup 0
          trap 'cleanup; exit 1' HUP INT TERM

          sed -n '/^http_get_file() {$/,/^}$/p' "${INSTALLER}" >"${FUNCTIONS_FILE}" || fail 'could not extract http_get_file'
          [ -s "${FUNCTIONS_FILE}" ] || fail 'http_get_file extraction was empty'
          # shellcheck disable=SC1090
          . "${FUNCTIONS_FILE}"

          ptxt_warn() { printf '%s\n' "$*" >>"${WARN_FILE}"; }
          curl_common_args() { :; }
          curl_insecure_arg() { printf '%s' ' -k'; }
          wget_common_args() { :; }
          wget_insecure_arg() { printf '%s' ' --no-check-certificate'; }
          wget_has_option() { [ "$1" = '--server-response' ]; }

          DOWNLOADER='curl'
          SECURE_STATUS=0
          ai_have_cmd() { [ "$1" = "${DOWNLOADER}" ]; }

          curl() {
          	printf '%s\n' "curl $*" >>"${CALLS_FILE}"
          	_out=''
          	_next=0
          	for _arg in "$@"; do
          		if [ "${_next}" -eq 1 ]; then _out="${_arg}"; _next=0; continue; fi
          		[ "${_arg}" = '-o' ] && _next=1
          	done
          	case " $* " in
          		*' -k '*) printf '%s\n' fallback >"${_out}"; return 0 ;;
          	esac
          	[ "${SECURE_STATUS}" -eq 0 ] && { printf '%s\n' secure >"${_out}"; return 0; }
          	printf '%s\n' partial >"${_out}"
          	return "${SECURE_STATUS}"
          }

          wget() {
          	printf '%s\n' "wget $*" >>"${CALLS_FILE}"
          	_out=''
          	_next=0
          	for _arg in "$@"; do
          		if [ "${_next}" -eq 1 ]; then _out="${_arg}"; _next=0; continue; fi
          		[ "${_arg}" = '-O' ] && _next=1
          	done
          	case " $* " in
          		*' --no-check-certificate '*) printf '%s\n' fallback >"${_out}"; return 0 ;;
          	esac
          	[ "${SECURE_STATUS}" -eq 0 ] && { printf '%s\n' secure >"${_out}"; return 0; }
          	printf '%s\n' partial >"${_out}"
          	return "${SECURE_STATUS}"
          }

          : >"${CALLS_FILE}"
          : >"${WARN_FILE}"
          SECURE_STATUS=0
          http_get_file 'https://example.invalid/component' "${TMP_ROOT}/out" '' insecure || fail 'secure curl request failed'
          [ "$(wc -l <"${CALLS_FILE}")" -eq 1 ] || fail 'secure curl success retried unnecessarily'
          ! grep -q ' -k ' "${CALLS_FILE}" || fail 'secure curl success used -k'
          [ "$(cat "${TMP_ROOT}/out")" = secure ] || fail 'secure curl output was not published'

          : >"${CALLS_FILE}"
          : >"${WARN_FILE}"
          SECURE_STATUS=60
          http_get_file 'https://example.invalid/component' "${TMP_ROOT}/out" '' insecure || fail 'curl insecure fallback did not recover certificate failure'
          [ "$(wc -l <"${CALLS_FILE}")" -eq 2 ] || fail 'curl fallback did not make exactly two attempts'
          ! sed -n '1p' "${CALLS_FILE}" | grep -q ' -k ' || fail 'first curl attempt disabled certificate verification'
          sed -n '2p' "${CALLS_FILE}" | grep -q ' -k ' || fail 'second curl attempt did not use -k fallback'
          grep -q 'certificate verification disabled' "${WARN_FILE}" || fail 'curl insecure fallback was not logged'

          : >"${CALLS_FILE}"
          if http_get_file 'http://example.invalid/component' "${TMP_ROOT}/out" '' insecure; then
          	fail 'plain HTTP failure incorrectly used insecure fallback'
          fi
          [ "$(wc -l <"${CALLS_FILE}")" -eq 1 ] || fail 'plain HTTP failure retried with insecure mode'

          DOWNLOADER='wget'
          : >"${CALLS_FILE}"
          : >"${WARN_FILE}"
          SECURE_STATUS=0
          http_get_file 'https://example.invalid/component' "${TMP_ROOT}/out" '' insecure || fail 'secure wget request failed'
          [ "$(wc -l <"${CALLS_FILE}")" -eq 1 ] || fail 'secure wget success retried unnecessarily'
          ! grep -q -- '--no-check-certificate' "${CALLS_FILE}" || fail 'secure wget success disabled certificate verification'

          : >"${CALLS_FILE}"
          : >"${WARN_FILE}"
          SECURE_STATUS=5
          http_get_file 'https://example.invalid/component' "${TMP_ROOT}/out" '' insecure || fail 'wget insecure fallback did not recover certificate failure'
          [ "$(wc -l <"${CALLS_FILE}")" -eq 2 ] || fail 'wget fallback did not make exactly two attempts'
          ! sed -n '1p' "${CALLS_FILE}" | grep -q -- '--no-check-certificate' || fail 'first wget attempt disabled certificate verification'
          sed -n '2p' "${CALLS_FILE}" | grep -q -- '--no-check-certificate' || fail 'second wget attempt did not use certificate fallback'
          grep -q 'certificate verification disabled' "${WARN_FILE}" || fail 'wget insecure fallback was not logged'

          printf '%s\n' 'PASS: installer secure-first transport fallback'
          '''
          Path('tests/installer-secure-download-fallback.sh').write_text(secure_test)

          usleep_test = r'''#!/bin/sh
          # Verify DNS guard readiness falls back from usleep to a bounded integer sleep.
          set -u

          S99_PATH="${1:-S99AdGuardHome}"
          TMP_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/s99-usleep-fallback.XXXXXX")" || exit 1
          FUNCTIONS_FILE="${TMP_ROOT}/functions"
          CALLS_FILE="${TMP_ROOT}/calls"

          cleanup() { rm -rf "${TMP_ROOT}"; }
          fail() { printf '%s\n' "FAIL: $*" >&2; exit 1; }
          trap cleanup 0
          trap 'cleanup; exit 1' HUP INT TERM

          sed -n '/^dns_retry_limit() {$/,/^}$/p; /^launch_dns_port_guard() {$/,/^}$/p' "${S99_PATH}" >"${FUNCTIONS_FILE}" || fail 'could not extract DNS guard helpers'
          [ -s "${FUNCTIONS_FILE}" ] || fail 'DNS guard helper extraction was empty'
          # shellcheck disable=SC1090
          . "${FUNCTIONS_FILE}"

          DNS_HANDOFF_DIR="${TMP_ROOT}/handoff"
          mkdir -p "${DNS_HANDOFF_DIR}" || fail 'could not create handoff directory'
          USLEEP_AVAILABLE=0

          dns_handoff_set_current_identity() {
          	DNS_HANDOFF_CURRENT_PID="$$"
          	DNS_HANDOFF_CURRENT_START_TIME="1"
          }
          dns_handoff_path_has_owner_mode() { return 0; }
          dns_guard_readiness_matches_identity() { return 1; }
          dns_handoff_marker_matches_identity() { return 0; }
          remove_current_dns_guard_readiness() { rm -rf "${DNS_GUARD_READY_DIR}"; }
          start_dns_port_guard() {
          	trap 'exit 0' HUP INT TERM
          	while :; do command sleep 1; done
          }
          stop_dns_port_guard() {
          	if [ -n "${ADGUARDHOME_DNS_GUARD_PID:-}" ]; then
          		command kill "${ADGUARDHOME_DNS_GUARD_PID}" 2>/dev/null || true
          		wait "${ADGUARDHOME_DNS_GUARD_PID}" 2>/dev/null || true
          		ADGUARDHOME_DNS_GUARD_PID=""
          	fi
          }
          which() {
          	[ "$1" = usleep ] && [ "${USLEEP_AVAILABLE}" -eq 1 ] && printf '%s\n' "${TMP_ROOT}/usleep"
          }
          sleep() { printf '%s\n' "sleep $*" >>"${CALLS_FILE}"; }
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "usleep $*" >>"$USLEEP_CALLS_FILE"' >"${TMP_ROOT}/usleep" || fail 'could not create usleep shim'
          chmod 755 "${TMP_ROOT}/usleep" || fail 'could not chmod usleep shim'
          PATH="${TMP_ROOT}:${PATH}"
          export PATH
          USLEEP_CALLS_FILE="${CALLS_FILE}"
          export USLEEP_CALLS_FILE

          : >"${CALLS_FILE}"
          USLEEP_AVAILABLE=0
          ADGUARDHOME_DNS_GUARD_READY_RETRIES=20
          if launch_dns_port_guard; then fail 'unready guard unexpectedly succeeded without usleep'; fi
          [ "$(grep -c '^sleep 1$' "${CALLS_FILE}")" -eq 1 ] || fail 'missing-usleep fallback did not scale 20 100ms attempts to one 1s delay between two checks'
          ! grep -q '^usleep ' "${CALLS_FILE}" || fail 'missing-usleep fallback still invoked usleep'

          : >"${CALLS_FILE}"
          USLEEP_AVAILABLE=1
          ADGUARDHOME_DNS_GUARD_READY_RETRIES=2
          if launch_dns_port_guard; then fail 'unready guard unexpectedly succeeded with usleep'; fi
          [ "$(grep -c '^usleep 100000$' "${CALLS_FILE}")" -eq 1 ] || fail 'available usleep path did not preserve 100000 microsecond polling'
          ! grep -q '^sleep 1$' "${CALLS_FILE}" || fail 'available usleep path used integer sleep fallback'

          printf '%s\n' 'PASS: S99 DNS guard usleep fallback'
          '''
          Path('tests/s99-usleep-fallback.sh').write_text(usleep_test)

          dnsmasq_test = r'''#!/bin/sh
          # Verify stop recovery uses a bounded adaptive dnsmasq readiness budget.
          set -u

          SCRIPT_PATH="${1:-AdGuardHome.sh}"
          TMP_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/dnsmasq-adaptive-readiness.XXXXXX")" || exit 1
          FUNCTIONS_FILE="${TMP_ROOT}/functions"
          CALLS_FILE="${TMP_ROOT}/calls"

          cleanup() { rm -rf "${TMP_ROOT}"; }
          fail() { printf '%s\n' "FAIL: $*" >&2; exit 1; }
          trap cleanup 0
          trap 'cleanup; exit 1' HUP INT TERM

          sed -n '/^monotonic_seconds() {$/,/^}$/p; /^post_stop_dnsmasq_timeout() {$/,/^}$/p; /^stop_adguardhome() {$/,/^}$/p' "${SCRIPT_PATH}" >"${FUNCTIONS_FILE}" || fail 'could not extract adaptive dnsmasq helpers'
          [ -s "${FUNCTIONS_FILE}" ] || fail 'adaptive dnsmasq helper extraction was empty'
          # shellcheck disable=SC1090
          . "${FUNCTIONS_FILE}"

          case "$(monotonic_seconds 2>/dev/null)" in
          	"" | *[!0-9]*) fail 'production monotonic uptime reader did not return integer seconds' ;;
          esac
          [ "$(post_stop_dnsmasq_timeout 0)" -eq 15 ] || fail 'default dnsmasq readiness floor is not 15 seconds'
          [ "$(post_stop_dnsmasq_timeout 4)" -eq 22 ] || fail 'dnsmasq timeout did not adapt to observed restart duration'
          [ "$(post_stop_dnsmasq_timeout 999999)" -eq 60 ] || fail 'adaptive dnsmasq timeout did not enforce the 60 second cap'
          ADGUARDHOME_DNSMASQ_READY_TIMEOUT=30
          [ "$(post_stop_dnsmasq_timeout 0)" -eq 30 ] || fail 'valid dnsmasq timeout override was not honored'
          ADGUARDHOME_DNSMASQ_READY_TIMEOUT=4
          [ "$(post_stop_dnsmasq_timeout 0)" -eq 15 ] || fail 'out-of-range dnsmasq timeout override bypassed the adaptive floor'
          unset ADGUARDHOME_DNSMASQ_READY_TIMEOUT

          PROCS='AdGuardHome'
          WORK_DIR="${TMP_ROOT}/work"
          MONOTONIC_NOW=100
          RESTART_SECONDS=0
          READY_AFTER=0
          READY_CHECKS=0
          SLEEP_CALLS=0
          SERVICE_STATUS=0

          monotonic_seconds() { printf '%s\n' "${MONOTONIC_NOW}"; }
          adguard_dnsmasq_managed() { return 0; }
          post_stop_process_ready() { return 0; }
          post_stop_handoff_cleared() { return 0; }
          post_stop_dnsmasq_ready() {
          	READY_CHECKS="$((READY_CHECKS + 1))"
          	[ "${READY_CHECKS}" -gt "${READY_AFTER}" ]
          }
          pidof() { return 1; }
          lower_script() { return 0; }
          remove_database_link() { :; }
          agh_log() { printf '%s\n' "$*" >>"${CALLS_FILE}"; }
          service() {
          	printf '%s\n' "service $*" >>"${CALLS_FILE}"
          	MONOTONIC_NOW="$((MONOTONIC_NOW + RESTART_SECONDS))"
          	return "${SERVICE_STATUS}"
          }
          sleep() { SLEEP_CALLS="$((SLEEP_CALLS + 1))"; }

          reset_case() {
          	: >"${CALLS_FILE}"
          	MONOTONIC_NOW=100
          	RESTART_SECONDS=0
          	READY_AFTER=0
          	READY_CHECKS=0
          	SLEEP_CALLS=0
          	SERVICE_STATUS=0
          	unset ADGUARDHOME_DNSMASQ_READY_TIMEOUT ADGUARDHOME_SKIP_DNSMASQ_RESTART
          }

          reset_case
          READY_AFTER=7
          stop_adguardhome || fail 'dnsmasq readiness after the old five-attempt threshold still failed'
          [ "${READY_CHECKS}" -eq 8 ] || fail 'extended default readiness did not reach the delayed success'
          [ "${SLEEP_CALLS}" -eq 7 ] || fail 'extended default readiness used the wrong delay count'
          [ "$(grep -c '^service restart_dnsmasq$' "${CALLS_FILE}")" -eq 1 ] || fail 'adaptive timing added an extra dnsmasq restart'

          reset_case
          RESTART_SECONDS=4
          READY_AFTER=20
          stop_adguardhome || fail 'observed slow dnsmasq restart did not expand readiness budget'
          [ "${READY_CHECKS}" -eq 21 ] || fail 'adaptive readiness did not wait to the simulated slow success'
          [ "${SLEEP_CALLS}" -eq 20 ] || fail 'adaptive readiness used the wrong slow-restart delay count'
          grep -q 'restart_elapsed=4.*timeout=22' "${CALLS_FILE}" || fail 'adaptive dnsmasq timing was not reflected in lifecycle logging'

          reset_case
          READY_AFTER=999
          if stop_adguardhome; then fail 'never-ready dnsmasq bypassed the bounded timeout'; fi
          [ "${READY_CHECKS}" -eq 15 ] || fail 'never-ready dnsmasq did not stop at the 15 second floor'
          [ "${SLEEP_CALLS}" -eq 14 ] || fail 'never-ready dnsmasq slept outside the bounded retry window'
          grep -q 'reason=dnsmasq_not_ready.*attempts=15.*timeout=15' "${CALLS_FILE}" || fail 'bounded dnsmasq timeout was not logged'

          printf '%s\n' 'PASS: adaptive dnsmasq stop readiness'
          '''
          Path('tests/dnsmasq-adaptive-readiness.sh').write_text(dnsmasq_test)

          replace_once(
              'tools/code-quality.sh',
              "run_check 'Installer SHA-256 helper regression' sh tests/installer-sha256-helper.sh\n",
              "run_check 'Installer SHA-256 helper regression' sh tests/installer-sha256-helper.sh\nrun_check 'Installer secure transport fallback regression' sh tests/installer-secure-download-fallback.sh\n"
          )
          replace_once(
              'tools/code-quality.sh',
              "run_check 'AdGuardHome S99 startup readiness regression' sh tests/s99-startup-readiness.sh\n",
              "run_check 'AdGuardHome S99 startup readiness regression' sh tests/s99-startup-readiness.sh\nrun_check 'AdGuardHome S99 usleep fallback regression' sh tests/s99-usleep-fallback.sh\n"
          )
          replace_once(
              'tools/code-quality.sh',
              "run_check 'AdGuardHome stop failure regression' sh tests/stop-adguardhome-failure.sh\n",
              "run_check 'AdGuardHome stop failure regression' sh tests/stop-adguardhome-failure.sh\nrun_check 'AdGuardHome dnsmasq adaptive readiness regression' sh tests/dnsmasq-adaptive-readiness.sh\n"
          )
          PY

          chmod 755 tests/installer-secure-download-fallback.sh tests/s99-usleep-fallback.sh tests/dnsmasq-adaptive-readiness.sh

      - name: Refresh runtime checksums
        shell: sh
        run: sh tools/update-checksums.sh

      - name: Validate targeted changes
        shell: sh
        run: |
          sh -n installer
          sh -n S99AdGuardHome
          sh -n AdGuardHome.sh
          sh -n tests/installer-secure-download-fallback.sh
          sh -n tests/s99-usleep-fallback.sh
          sh -n tests/dnsmasq-adaptive-readiness.sh
          sh tests/installer-secure-download-fallback.sh
          sh tests/s99-usleep-fallback.sh
          sh tests/dnsmasq-adaptive-readiness.sh
          sh tests/stop-adguardhome-failure.sh
          sh tests/dns-startup-handoff.sh
          sh tools/check-md5.sh
          sh tools/check-sha256.sh
          sh tools/check-release-consistency.sh

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            installer installer.md5sum installer.sha256sum \
            S99AdGuardHome S99AdGuardHome.md5sum S99AdGuardHome.sha256sum \
            AdGuardHome.sh AdGuardHome.sh.md5sum AdGuardHome.sh.sha256sum \
            tests/installer-secure-download-fallback.sh \
            tests/s99-usleep-fallback.sh \
            tests/dnsmasq-adaptive-readiness.sh \
            tests/dns-startup-handoff.sh \
            tests/stop-adguardhome-failure.sh \
            tools/code-quality.sh
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden download and DNS recovery'
          git push origin HEAD:v2.6.5
