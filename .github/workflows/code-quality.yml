name: Code Quality

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: sh

permissions:
  contents: write

jobs:
  shell-quality:
    name: Shell and checksum quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt ripgrep dnsmasq

      - name: Run code quality checks
        # GNU timeout is CI-only; router production scripts remain independent of it.
        env:
          TEST_MAX_RUNTIME_SECONDS: 180
        run: sh tools/code-quality.sh

      - name: Explain formatting remediation
        if: failure()
        run: |
          {
            printf '%s\n' '## Code quality remediation'
            printf '%s\n' ''
            printf '%s\n' 'If the failure above is from `shfmt`, run `tools/code-quality.sh --fix` locally and commit the formatting changes, or dispatch the `Create shfmt formatting PR` workflow against this branch.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-final-hardening:
    name: Apply verified final hardening fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'v2.6.5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: v2.6.5
          fetch-depth: 0

      - name: Install focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static dnsmasq

      - name: Apply and validate verified findings
        run: |
          set -eu
          if ! grep -Fq '(Defer / Apply / Modify) defaulting to **Defer**' .agents/skills/qodo-pr-resolver/resources/convergence.md; then
            printf '%s\n' 'Verified final hardening fixes are already present.'
            exit 0
          fi

          python3 .github/scripts/apply-final-hardening.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/qodo-get-rules-config-validation.sh')
          text = path.read_text()
          old = '''[ "$(grep -Fc 'else .[0] end |' "${SEARCH_ENDPOINT}")" -eq 2 ] ||
          \tfail "${SEARCH_ENDPOINT}: both response validators must validate one parsed object"
          '''
          new = '''[ "$(grep -Fc 'if type != "object" or (.rules | type) != "array" then' "${SEARCH_ENDPOINT}")" -eq 2 ] ||
          \tfail "${SEARCH_ENDPOINT}: both response validators must directly validate the documented object with a rules array"
          [ "$(grep -Fc 'else .[0] end |' "${SEARCH_ENDPOINT}")" -eq 0 ] ||
          \tfail "${SEARCH_ENDPOINT}: response validators still unwrap the obsolete singleton-array response"
          '''
          if text.count(old) != 1:
              raise SystemExit('qodo-get-rules config regression: obsolete response-validator assertion was not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          busybox ash -n tools/download-adguardhome-static.sh
          busybox ash -n tests/dns-startup-handoff.sh
          busybox ash -n tests/download-static-interruption-cleanup.sh
          busybox ash -n tests/installer-doctor-fix-safety.sh
          busybox ash -n tests/installer-end-op-rollback.sh
          busybox ash -n tests/installer-secure-download-fallback.sh
          busybox ash -n tests/runtime-writable-path-security.sh
          busybox ash -n tests/qodo-get-rules-config-validation.sh

          sudo -n busybox ash tests/dns-startup-handoff.sh
          sh tests/download-static-interruption-cleanup.sh
          sh tests/installer-doctor-fix-safety.sh
          sh tests/installer-end-op-rollback.sh
          sh tests/installer-secure-download-fallback.sh
          sudo -n sh tests/runtime-writable-path-security.sh
          sh tests/qodo-provider-thread-resolution.sh
          sh tests/qodo-get-rules-config-validation.sh
          sh tests/qodo-get-rules-query-output-consistency.sh

          ! grep -F 'command sleep 0.01' tests/dns-startup-handoff.sh
          ! grep -F 'type != "array" or length != 1' .agents/skills/qodo-get-rules/references/search-endpoint.md
          grep -F 'decision=held action=none' .agents/skills/qodo-pr-resolver/resources/convergence.md >/dev/null
          grep -F 'git add -- "$file"' .agents/skills/qodo-pr-resolver/SKILL.md >/dev/null
          git diff --check

      - name: Commit focused fixes
        run: |
          set -eu
          if git diff --quiet; then
            printf '%s\n' 'No focused hardening changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            .agents/skills/qodo-pr-resolver/resources/convergence.md \
            .agents/skills/qodo-pr-resolver/SKILL.md \
            tests/dns-startup-handoff.sh \
            tools/download-adguardhome-static.sh \
            tests/download-static-interruption-cleanup.sh \
            tests/installer-doctor-fix-safety.sh \
            tests/installer-end-op-rollback.sh \
            tests/installer-secure-download-fallback.sh \
            tests/runtime-writable-path-security.sh \
            .agents/skills/qodo-get-rules/references/search-endpoint.md \
            tests/qodo-get-rules-config-validation.sh \
            REVIEW.md
          do
            git add -- "$file"
          done
          git diff --cached --check
          git commit -m 'fix: address final CodeRabbit review findings'
          git push origin HEAD:v2.6.5
