name: Code Quality

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: sh

permissions:
  contents: read

jobs:
  shell-quality:
    name: Shell and checksum quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt ripgrep dnsmasq curl

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -eu
          archive="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint -shellcheck= -pyflakes=

      - name: Run code quality checks
        # GNU timeout is CI-only; router production scripts remain independent of it.
        env:
          TEST_MAX_RUNTIME_SECONDS: 180
        run: sh tools/code-quality.sh

      - name: Explain formatting remediation
        if: failure()
        run: |
          {
            printf '%s\n' '## Code quality remediation'
            printf '%s\n' ''
            printf '%s\n' 'If the failure above is from `shfmt`, run `tools/code-quality.sh --fix` locally and commit the formatting changes, or dispatch the `Create shfmt formatting PR` workflow against this branch.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-sonar-maintainability:
    name: Apply reviewed Sonar maintainability fixes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v2.6.5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: v2.6.5
          fetch-depth: 2

      - name: Apply reviewed Sonar fixes
        run: |
          set -eu
          for helper in \
            .github/scripts/apply-sonar-maintainability.py \
            .github/scripts/sync-qodo-config-snippet.py; do
            [ -f "${helper}" ] || {
              printf '%s\n' "Error: staged helper is missing: ${helper}" >&2
              exit 1
            }
          done
          python3 .github/scripts/apply-sonar-maintainability.py
          python3 .github/scripts/sync-qodo-config-snippet.py

      - name: Validate focused changes
        run: |
          set -eu
          sh -n tools/download-adguardhome-static.sh
          sh -n tools/code-quality.sh
          sh -n tools/check-release-consistency.sh
          sh -n .agents/skills/qodo-get-rules/config-parsing.sh
          sh tests/code-quality-checks.sh
          sh tests/release-consistency.sh
          sh tests/download-static-failure-safety.sh
          sh tests/qodo-get-rules-config-validation.sh

      - name: Publish validated code changes
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sonar-project.properties \
            tools/download-adguardhome-static.sh \
            tools/code-quality.sh \
            tools/check-release-consistency.sh \
            .agents/skills/qodo-get-rules/config-parsing.sh \
            .agents/skills/qodo-get-rules/SKILL.md
          git diff --cached --check
          git commit -m 'fix: address Sonar maintainability findings'
          git push origin HEAD:v2.6.5
