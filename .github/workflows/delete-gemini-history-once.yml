name: 'Delete Gemini workflow history once'

on:
  pull_request:
    types:
      - 'synchronize'
    paths:
      - '.github/workflows/delete-gemini-history-once.yml'

permissions:
  actions: 'write'
  contents: 'read'

jobs:
  cleanup:
    if: |-
      github.head_ref == 'codex/github-mention-add-nvram-transaction-api-and-use-it-for-dns' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15

    steps:
      - name: 'Delete Gemini workflow runs'
        env:
          GH_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
        shell: 'bash'
        run: |-
          set -euo pipefail

          deleted_runs=0
          skipped_runs=0
          matched_workflows=0

          while IFS=$'\t' read -r workflow_id workflow_name workflow_path; do
            [ -n "${workflow_id}" ] || continue
            matched_workflows=$((matched_workflows + 1))
            echo "Cleaning ${workflow_name} (${workflow_path})"

            mapfile -t run_ids < <(
              gh api --paginate \
                "repos/${REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[].id'
            )

            for run_id in "${run_ids[@]}"; do
              [ -n "${run_id}" ] || continue
              if gh api --silent --method DELETE \
                "repos/${REPOSITORY}/actions/runs/${run_id}"; then
                deleted_runs=$((deleted_runs + 1))
                echo "Deleted run ${run_id}"
              else
                skipped_runs=$((skipped_runs + 1))
                echo "Skipped unavailable run ${run_id}"
              fi
            done
          done < <(
            gh api --paginate \
              "repos/${REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.path | test("^\\.github/workflows/gemini-[^/]*\\.ya?ml$")) | [.id, .name, .path] | @tsv'
          )

          {
            echo '## Gemini workflow history cleanup'
            echo
            echo "Matched workflows: ${matched_workflows}"
            echo "Deleted runs: ${deleted_runs}"
            echo "Already unavailable: ${skipped_runs}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Matched ${matched_workflows} Gemini workflows, deleted ${deleted_runs} runs, and skipped ${skipped_runs} unavailable runs."
