name: Code Quality Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

defaults:
  run:
    shell: sh

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    name: Local Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Check out selected ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt ripgrep dnsmasq

      - name: Run local code quality checks
        env:
          TEST_MAX_RUNTIME_SECONDS: 180
        run: sh tools/code-quality.sh

  sonarcloud:
    name: SonarQube Cloud Advisory Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - name: Check out pull request merge
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Check out selected ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize Sonar token
        env:
          RAW_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -eu
          normalized_token="$(printf '%s' "${RAW_SONAR_TOKEN}" | tr -d '\r\n')"
          [ -n "${normalized_token}" ] || {
            printf '%s\n' 'Error: SONAR_TOKEN is empty after normalization.' >&2
            exit 1
          }
          printf '::add-mask::%s\n' "${normalized_token}"
          printf 'SONAR_TOKEN=%s\n' "${normalized_token}" >> "${GITHUB_ENV}"

      - name: Select Java 21 for SonarScanner
        run: |
          set -eu
          [ -n "${JAVA_HOME_21_X64:-}" ] && [ -x "${JAVA_HOME_21_X64}/bin/java" ] || {
            printf '%s\n' 'Error: GitHub runner Java 21 is unavailable.' >&2
            exit 1
          }
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "${GITHUB_ENV}"
          printf '%s\n' "${JAVA_HOME_21_X64}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME_21_X64}/bin/java" -version

      - name: SonarQube Cloud advisory scan
        id: sonar_scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"

      - name: Report SonarQube Cloud advisory status
        if: always()
        env:
          SONAR_OUTCOME: ${{ steps.sonar_scan.outcome }}
        run: |
          if [ "${SONAR_OUTCOME}" = success ]; then
            printf '%s\n' 'SonarQube Cloud advisory analysis completed successfully.'
          else
            printf '%s\n' '::warning title=SonarQube Cloud advisory unavailable::The advisory scanner could not complete. JRE auto-provisioning is disabled and the GitHub runner Java 21 runtime is used directly. If SonarQube Cloud still returns HTTP 401/403, regenerate SONAR_TOKEN and replace the GitHub Actions secret.'
          fi
