name: '🤖 Gemini Comment Bootstrap'

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: 'gemini-comment-${{ github.event.issue.number }}'
  cancel-in-progress: false

permissions:
  contents: 'read'
  issues: 'write'
  pull-requests: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  invoke:
    if: |-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: 'ubuntu-latest'
    timeout-minutes: 40

    steps:
      - name: 'Resolve trusted pull request head'
        id: 'pr'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const pullNumber = context.issue.number;
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` || pull.head.repo.fork) {
              core.setFailed('Gemini comment commands do not execute workflow code from forked repositories.');
              return;
            }

            core.setOutput('head_sha', pull.head.sha);
            core.setOutput('title', pull.title || '');
            core.setOutput('body', pull.body || '');

      - name: 'Acknowledge Gemini request'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 @${context.actor}, I received your Gemini request. [View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });

      - name: 'Checkout exact pull request head'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8'
        with:
          ref: '${{ steps.pr.outputs.head_sha }}'
          persist-credentials: 'false'

      - name: 'Verify Gemini implementation'
        run: |-
          set -euo pipefail
          test -f .github/actions/run-gemini-resilient/action.yml
          test -f .github/workflows/gemini-invoke.toml

      - name: 'Install prompt dependencies'
        run: |-
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
          fi
          jq --version

      - name: 'Prepare Gemini request'
        env:
          PR_TITLE: '${{ steps.pr.outputs.title }}'
          PR_BODY: '${{ steps.pr.outputs.body }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
          PR_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          mkdir -p .gemini/commands
          cp .github/workflows/gemini-invoke.toml .gemini/commands/repository-gemini-invoke.toml

          additional_context="${COMMENT_BODY#@gemini-cli}"
          additional_context="${additional_context# }"

          jq -n \
            --arg title "${PR_TITLE}" \
            --arg desc "${PR_BODY}" \
            --arg event 'issue_comment' \
            --arg pr 'true' \
            --arg num "${PR_NUMBER}" \
            --arg repo "${REPOSITORY}" \
            --arg context "${additional_context}" \
            '{title: $title, description: $desc, event_name: $event, is_pull_request: $pr, issue_number: $num, repository: $repo, additional_context: $context}' > .gemini/context.json

      - name: 'Run Gemini CLI resiliently'
        id: 'gemini'
        uses: './.github/actions/run-gemini-resilient'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          github_token: '${{ github.token }}'
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.52.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MODEL || 'auto' }}"
          fallback_model: "${{ vars.GEMINI_FALLBACK_MODEL || 'flash' }}"
          fallback_delay_seconds: "${{ vars.GEMINI_FALLBACK_DELAY_SECONDS || '45' }}"
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'gemini-comment-bootstrap'
          github_pr_number: '${{ github.event.issue.number }}'
          requires_docker: 'true'
          settings: |-
            {
              "general": {
                "retryFetchErrors": true,
                "maxAttempts": 6
              },
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcp": {
                "allowed": ["github"]
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v1.0.5"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "issue_read",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "timeout": 60000,
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}",
                    "GITHUB_TOOLS": "add_issue_comment,issue_read,list_issues,search_issues,pull_request_read,list_pull_requests,search_pull_requests,get_commit,get_file_contents,list_commits,search_code"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/repository-gemini-invoke'

      - name: 'Report bootstrap failure'
        if: '${{ failure() }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Gemini could not process the request. [View the failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });
