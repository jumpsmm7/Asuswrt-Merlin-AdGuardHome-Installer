name: '🔀 Gemini Triage'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-triage-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    outputs:
      available_labels_json: '${{ steps.get_labels.outputs.available_labels_json }}'
      selected_labels_json: '${{ steps.validate_labels.outputs.selected_labels_json }}'
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8'
        with:
          persist-credentials: 'false'

      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }

            const labelNames = [...new Set(labels.map((label) => label.name))].sort();
            if (labelNames.length === 0) {
              core.setFailed('There are no issue labels in this repository.');
              return;
            }

            core.setOutput('available_labels_json', JSON.stringify(labelNames));
            core.info(`Found ${labelNames.length} repository labels.`);

      - name: 'Install prompt dependencies'
        run: |-
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq
          fi
          jq --version

      - name: 'Prepare prompt context'
        env:
          AVAILABLE_LABELS_JSON: '${{ steps.get_labels.outputs.available_labels_json }}'
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
        run: |-
          set -euo pipefail
          mkdir -p .gemini/commands
          cp .github/workflows/gemini-triage.toml .gemini/commands/repository-gemini-triage.toml
          jq -n \
            --argjson labels "${AVAILABLE_LABELS_JSON}" \
            --arg title "${ISSUE_TITLE}" \
            --arg body "${ISSUE_BODY}" \
            '{available_labels: $labels, issue_title: $title, issue_body: $body}' > .gemini/context.json

      - name: 'Run Gemini issue analysis resiliently'
        id: 'gemini_analysis'
        if: '${{ steps.get_labels.outputs.available_labels_json != "" }}'
        uses: './.github/actions/run-gemini-resilient'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.52.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_TRIAGE_MODEL || vars.GEMINI_MODEL || 'flash' }}"
          fallback_model: "${{ vars.GEMINI_TRIAGE_FALLBACK_MODEL || vars.GEMINI_FALLBACK_MODEL || 'flash-lite' }}"
          fallback_delay_seconds: "${{ vars.GEMINI_FALLBACK_DELAY_SECONDS || '45' }}"
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS || false }}'
          workflow_name: 'gemini-triage'
          github_issue_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "general": {
                "retryFetchErrors": true,
                "maxAttempts": 6
              },
              "model": {
                "maxSessionTurns": 8
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/repository-gemini-triage'

      - name: 'Validate selected labels'
        id: 'validate_labels'
        if: '${{ always() && steps.gemini_analysis.outcome == "success" }}'
        env:
          RAW_SUMMARY: '${{ steps.gemini_analysis.outputs.summary }}'
          AVAILABLE_LABELS_JSON: '${{ steps.get_labels.outputs.available_labels_json }}'
        run: |-
          set -euo pipefail

          selected='[]'
          if jq -e 'type == "array"' <<< "${RAW_SUMMARY}" >/dev/null 2>&1; then
            selected="$(jq -cn \
              --argjson raw "${RAW_SUMMARY}" \
              --argjson allowed "${AVAILABLE_LABELS_JSON}" \
              '$raw | map(. as $label | select(($label | type) == "string" and ($allowed | index($label) != null))) | unique'
            )"
          else
            echo '::warning title=Invalid Gemini triage output::Expected a JSON array; no labels will be applied.'
          fi

          printf 'selected_labels_json=%s\n' "${selected}" >> "${GITHUB_OUTPUT}"

  label:
    runs-on: 'ubuntu-latest'
    needs: 'triage'
    if: '${{ needs.triage.outputs.selected_labels_json != "" && needs.triage.outputs.selected_labels_json != "[]" }}'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID != "" }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply validated labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        env:
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          AVAILABLE_LABELS_JSON: '${{ needs.triage.outputs.available_labels_json }}'
          SELECTED_LABELS_JSON: '${{ needs.triage.outputs.selected_labels_json }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10);
            const availableLabels = JSON.parse(process.env.AVAILABLE_LABELS_JSON || '[]');
            const selectedLabels = JSON.parse(process.env.SELECTED_LABELS_JSON || '[]')
              .filter((label) => typeof label === 'string' && availableLabels.includes(label));

            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('Invalid issue number.');
              return;
            }
            if (selectedLabels.length === 0) {
              core.info('No validated labels to apply.');
              return;
            }

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [...new Set(selectedLabels)].sort(),
            });
            core.info(`Applied labels: ${selectedLabels.join(', ')}`);
